<!DOCTYPE html>
<html>
<head>
<title>KaagazSeva Receipt</title>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:#f3f6fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.receipt{
    background:white;
    width:520px;
    padding:35px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* Header */
.header{
    text-align:center;
    border-bottom:2px solid #eee;
    padding-bottom:15px;
    margin-bottom:20px;
}
.logo{
    font-size:26px;
    font-weight:bold;
    color:#0a4fa3;
}
.tag{
    font-size:13px;
    color:#666;
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
td{
    padding:10px;
    border-bottom:1px solid #eee;
}
.label{
    font-weight:bold;
    color:#333;
}

.id{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin:18px 0;
    color:#0a4fa3;
}

.footer{
    text-align:center;
    margin-top:20px;
}

button{
    padding:12px 22px;
    background:#0a4fa3;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="receipt">

<div class="header">
<div class="logo">KaagazSeva</div>
<div class="tag">India's Trusted Document Service Network</div>
</div>

<div class="id" id="appId"></div>

<table>
<tr><td class="label">Customer Name</td><td id="name"></td></tr>
<tr><td class="label">Mobile Number</td><td id="mobile"></td></tr>
<tr><td class="label">Service</td><td id="service"></td></tr>
<tr><td class="label">Handled By</td><td id="agent"></td></tr>
<tr><td class="label">Amount Paid</td><td>₹<span id="amount"></span></td></tr>
<tr><td class="label">Date</td><td id="date"></td></tr>
</table>

<div class="footer">
<button onclick="download()">Download Receipt</button>
</div>

</div>
<script src="config.js"></script>
<script>
document.getElementById("appId").innerText = "Application ID: " + localStorage.getItem("application_id");
document.getElementById("name").innerText = localStorage.getItem("cust_name");
document.getElementById("mobile").innerText = localStorage.getItem("cust_mobile");
document.getElementById("service").innerText = localStorage.getItem("cust_service");
document.getElementById("amount").innerText = localStorage.getItem("payment_amount");
document.getElementById("agent").innerText = localStorage.getItem("agent_name") || "Assigned Soon";
document.getElementById("date").innerText = new Date().toLocaleDateString();

function download(){
    window.print();
}
</script>

</body>
</html>
