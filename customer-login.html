<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login - KaagazSeva</title>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(120deg,#eef3fb,#f7f9fc);
}

.container{
    background:white;
    padding:45px;
    border-radius:18px;
    width:380px;
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

h2{
    color:#0a4fa3;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#0a4fa3;
    color:white;
}

button:hover{opacity:0.9;}

#otp-section{display:none;}
</style>
</head>

<body>

<div class="container">
<h2>Customer Login</h2>

<input type="text" id="mobile" placeholder="Enter Mobile Number">
<button onclick="sendOtp()">Send OTP</button>

<div id="otp-section">
<input type="text" id="otp" placeholder="Enter 6-digit OTP">
<button onclick="verifyOtp()">Verify OTP</button>
</div>

</div>

<script>
async function sendOtp(){
    const mobile=document.getElementById("mobile").value;

    // Updated to authFetch
    const res = await authFetch("/api/send-otp", {
        method: "POST",
        body: JSON.stringify({mobile})
    });

    if(res.ok){
        document.getElementById("otp-section").style.display="block";
        alert("OTP sent (check backend logs for now)");
    }
}

async function verifyOtp(){
    const mobile=document.getElementById("mobile").value;
    const otp=document.getElementById("otp").value;

    // Updated to authFetch
    const res = await authFetch("/api/verify-otp", {
        method: "POST",
        body: JSON.stringify({mobile, otp})
    });

    const data = await res.json();

    if(data.access_token){
        // Store the token and redirect
        localStorage.setItem("token", data.access_token);
        window.location.href="../dashboard.html";
    } else {
        alert("Invalid or expired OTP");
    }
}
</script>

</body>
</html>
