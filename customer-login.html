<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login - KaagazSeva</title>

<style>
body{
    font-family: Arial;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    background:white;
    padding:40px;
    border-radius:12px;
    width:340px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.1);
}
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:6px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:12px;
    background:#0a4fa3;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}
#otpSection{display:none;}
</style>
</head>

<body>

<div class="container">
<h2>Customer Login</h2>

<div id="mobileSection">
<input type="text" id="mobile" placeholder="Enter Mobile Number">
<button onclick="sendOTP()">Send OTP</button>
</div>

<div id="otpSection">
<input type="text" id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify OTP</button>
</div>

</div>

<script src="config.js"></script>
<script>

function sendOTP(){
    const mobile = document.getElementById('mobile').value;

    if(mobile.length !== 10){
        alert("Enter valid mobile number");
        return;
    }

    fetch(`${API_BASE}/api/send-otp`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({mobile:mobile})
    })
    .then(res=>res.json())
    .then(data=>{
        if(data.success){
            alert("OTP Sent Successfully");
            document.getElementById('otpSection').style.display='block';
        }else{
            alert("OTP sending failed");
        }
    });
}

function verifyOTP(){
    const mobile = document.getElementById('mobile').value;
    const otp = document.getElementById('otp').value;

    fetch(`${API_BASE}/api/verify-otp`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({mobile:mobile, otp:otp})
    })
    .then(res=>res.json())
    .then(data=>{
        if(data.success){
            alert("Login Successful");
            window.location.href = "apply-service.html";
        }else{
            alert("Invalid OTP");
        }
    });
}

</script>

</body>
</html>
