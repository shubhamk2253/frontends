<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Control Tower | Premium Admin</title>
    
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg: #05060b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --text: #f8fafc;
            --text-dim: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #05060b 80%);
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 10px 0;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1.5px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        #riskBanner {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 20px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 15px 30px -10px var(--accent-glow);
        }

        .card-label {
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
            margin: 15px 0 5px 0;
            color: #fff;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            margin-bottom: 10px;
        }

        .badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-logout:hover { background: var(--danger); color: white; }
        #chartWrapper { height: 350px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1><i class="fas fa-radar"></i> Control Tower</h1>
            <div id="riskBanner">SYSTEM SCANNING...</div>
        </div>
        <button onclick="logout()" class="btn-logout"><i class="fas fa-power-off"></i> Exit Tower</button>
    </div>

    <div class="grid" id="metricsDisplay">
        <div class="card">Loading telemetry...</div>
    </div>

    <div class="content-grid">
        <div class="card">
            <h3 style="margin:0"><i class="fas fa-map-location-dot"></i> State-wise Market Share</h3>
            <div id="chartWrapper">
                <canvas id="stateChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3 style="margin:0"><i class="fas fa-bolt"></i> Elite Performance Agents</h3>
            <div id="agentsDisplay" class="list-container" style="margin-top: 15px;"></div>
        </div>
    </div>
</div>

<script>
    // 1. Mandatory Role Check (Immediately blocks unauthorized access)
    // Assumes requireRole is defined in your auth.js
    if (typeof requireRole === "function") {
        requireRole("founder");
    }

    async function loadTower() {
        try {
            // Using authFetch: Automatically handles API_BASE and Authorization Header
            const res = await authFetch("/api/founder/control-tower");

            if (!res.ok) {
                // auth.js usually handles 401/403, but added as fallback
                if (res.status === 401 || res.status === 403) logout();
                return;
            }

            const data = await res.json();
            const m = data.metrics;

            // Render Metrics
            document.getElementById("metricsDisplay").innerHTML = `
                <div class="card">
                    <div class="card-label"><i class="fas fa-coins"></i> Total Revenue</div>
                    <div class="card-value">₹${(m.total_revenue || 0).toLocaleString()}</div>
                    <div style="color:var(--success); font-size:12px">Total Gross Value</div>
                </div>
                <div class="card">
                    <div class="card-label"><i class="fas fa-calendar-day"></i> Today's Inflow</div>
                    <div class="card-value">₹${(m.today_revenue || 0).toLocaleString()}</div>
                    <div style="color:var(--accent); font-size:12px">Live Daily Stats</div>
                </div>
                <div class="card">
                    <div class="card-label"><i class="fas fa-chart-pie"></i> Net Profit</div>
                    <div class="card-value" style="color: var(--success)">₹${(m.total_profit || 0).toLocaleString()}</div>
                    <div style="color:var(--text-dim); font-size:12px">Platform Commission</div>
                </div>
                <div class="card">
                    <div class="card-label"><i class="fas fa-file-invoice"></i> Applications</div>
                    <div class="card-value">${m.total_applications || 0}</div>
                    <div style="color:var(--text-dim); font-size:12px">Processed Volume</div>
                </div>
                <div class="card">
                    <div class="card-label"><i class="fas fa-hourglass-half"></i> Payout Liability</div>
                    <div class="card-value" style="color: var(--warning)">₹${(m.pending_payouts || 0).toLocaleString()}</div>
                    <div style="color:var(--text-dim); font-size:12px">Owed to Agents</div>
                </div>
                <div class="card">
                    <div class="card-label"><i class="fas fa-percent"></i> Refund Ratio</div>
                    <div class="card-value" style="color: ${m.refund_ratio_percent > 10 ? 'var(--danger)' : 'var(--text)'}">${m.refund_ratio_percent || 0}%</div>
                    <div style="color:var(--text-dim); font-size:12px">Target: < 5%</div>
                </div>
            `;

            // Update Risk Status
            const riskEl = document.getElementById("riskBanner");
            riskEl.innerText = data.risk_status || "UNKNOWN";
            const isStable = data.risk_status === "STABLE";
            riskEl.style.backgroundColor = isStable ? "rgba(16, 185, 129, 0.1)" : "rgba(239, 68, 68, 0.1)";
            riskEl.style.color = isStable ? "var(--success)" : "var(--danger)";

            // Update Top Agents
            document.getElementById("agentsDisplay").innerHTML = (data.top_agents || []).map(a => `
                <div class="list-item">
                    <div style="font-weight:600">${a.agent || a.name}</div>
                    <div class="badge">${a.completed_orders || a.completed || 0} Success</div>
                </div>
            `).join("");

            renderStateChart(data.state_performance || []);

        } catch (err) {
            console.error("Tower Error:", err);
            document.getElementById("metricsDisplay").innerHTML = `<div class="card" style="color:var(--danger)">Offline: Unable to sync with Command Center.</div>`;
        }
    }

    function renderStateChart(stateData) {
        const ctx = document.getElementById('stateChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: stateData.map(s => s.state || s.state_id),
                datasets: [{
                    label: 'Applications',
                    data: stateData.map(s => s.applications || s.count),
                    backgroundColor: 'rgba(99, 102, 241, 0.6)',
                    borderColor: '#6366f1',
                    borderWidth: 2,
                    borderRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
                    x: { grid: { display: false }, ticks: { color: '#64748b' } }
                }
            }
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "../login.html";
    }

    // Initialize Tower
    loadTower();
</script>
</body>
</html>
