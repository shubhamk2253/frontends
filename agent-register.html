<!DOCTYPE html>
<html>
<head>
<title>KaagazSeva Agent Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(120deg,#0a4fa3,#0f6ad6);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Card */
.card{
    background:white;
    padding:50px 45px;
    width:440px;
    border-radius:22px;
    box-shadow:0 25px 60px rgba(0,0,0,0.18);
    text-align:center;
    animation:fade 0.5s ease;
    position:relative;
}

/* Premium top strip */
.card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:6px;
    border-radius:22px 22px 0 0;
    background:linear-gradient(90deg,#0a4fa3,#0f6ad6);
}

@keyframes fade{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#0a4fa3;
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    margin-bottom:28px;
    font-size:15px;
}

/* Inputs */
input{
    width:100%;
    padding:15px;
    margin:11px 0;
    border:1px solid #d6dbe6;
    border-radius:12px;
    font-size:15px;
    transition:0.25s;
}

input:focus{
    outline:none;
    border-color:#0a4fa3;
    box-shadow:0 0 0 3px rgba(10,79,163,0.08);
}

/* Button */
button{
    width:100%;
    padding:15px;
    margin-top:18px;
    background:linear-gradient(90deg,#0a4fa3,#0f6ad6);
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(10,79,163,0.28);
}
</style>
</head>

<body>

<div class="card">
<div class="logo">KaagazSeva</div>
<div class="subtitle">Premium Agent Partner Registration</div>

<input id="name" placeholder="Agent Name">
<input id="mobile" placeholder="Mobile Number">
<input id="district" placeholder="District">
<input id="pincode" placeholder="Service Pincode">

<button onclick="register()">Register as Agent</button>
</div>
<script src="config.js"></script>
<script>
function register(){
    fetch(`${API_BASE}/api/agent/register`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            name:document.getElementById("name").value,
            mobile:document.getElementById("mobile").value,
            district:document.getElementById("district").value,
            pincode:document.getElementById("pincode").value
        })
    })
    .then(res=>res.json())
    .then(d=>{
        alert("Agent Registered Successfully");
    });
}
</script>

</body>
</html>
