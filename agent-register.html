<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Onboarding | KaagazSeva Partner Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0a4fa3;
            --primary-dark: #063166;
            --bg-canvas: #f8fafc;
            --text-heading: #0f172a;
            --text-body: #475569;
            --border: #e2e8f0;
            --white: #ffffff;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-canvas); color: var(--text-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* Main Onboarding Card */
        .onboarding-card {
            background: var(--white);
            width: 100%;
            max-width: 520px;
            padding: 48px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        /* Progress Bar */
        .progress-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: #edf2f7;
        }
        .progress-bar {
            height: 100%; width: 50%; background: var(--primary); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand { color: var(--primary); font-weight: 800; font-size: 18px; margin-bottom: 30px; display: flex; align-items: center; gap: 8px; }
        h1 { color: var(--text-heading); font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        .subtitle { margin-bottom: 35px; font-size: 15px; }

        /* Form Layout */
        .form-section { display: none; animation: slideIn 0.4s ease-out forwards; }
        .form-section.active { display: block; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; color: var(--text-heading); }
        
        input, select {
            width: 100%; padding: 16px; border: 1.5px solid var(--border); border-radius: 14px;
            font-size: 16px; transition: 0.3s; background: #fff;
        }

        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(10, 79, 163, 0.1); }

        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        
        .btn {
            flex: 1; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; border: none;
        }

        .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(10, 79, 163, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-secondary { background: #f1f5f9; color: var(--text-heading); }

        /* Confirmation Drawer */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            visibility: hidden; opacity: 0; transition: 0.4s; z-index: 1000;
        }
        .drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: white; border-radius: 32px 32px 0 0;
            padding: 40px; transition: 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 1001;
        }
        .drawer.active { bottom: 0; }
        .drawer-overlay.active { visibility: visible; opacity: 1; }

        .summary-box { background: #f8fafc; padding: 20px; border-radius: 18px; margin: 20px 0; border: 1px solid var(--border); }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; }
        .summary-row:last-child { border: none; }

        /* Agreement Styling */
        .legal-check {
            display: flex; align-items: flex-start; gap: 10px; margin: 15px 0; cursor: pointer;
        }
        .legal-check input { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; }
        .legal-check span { font-size: 13px; font-weight: 500; color: var(--text-body); text-transform: none; letter-spacing: normal; }
        .legal-check a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="onboarding-card">
    <div class="progress-container"><div class="progress-bar" id="p-bar"></div></div>
    
    <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12,12A4,4 0 1,1 16,8A4,4 0 0,1 12,12M12,20C10,20 8,19.4 6.5,18.4C6.7,17.4 9,16.8 12,16.8C15,16.8 17.3,17.4 17.5,18.4C16,19.4 14,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg>
        KaagazSeva Partner
    </div>

    <h1 id="title">Personal Info</h1>
    <p class="subtitle" id="subtitle">Step 1: Tell us who you are.</p>

    <div class="form-section active" id="step1">
        <div class="form-group">
            <label>Legal Name</label>
            <input type="text" id="name" placeholder="Full name as per PAN">
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="mobile" maxlength="10" placeholder="Contact number">
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="nextStep(2)">Next: Service Area</button>
        </div>
    </div>

    <div class="form-section" id="step2">
        <div class="form-group">
            <label>Business District</label>
            <input type="text" id="district" placeholder="e.g. Pune, Lucknow">
        </div>
        <div class="form-group">
            <label>Primary Service Pincode</label>
            <input type="text" id="pincode" maxlength="6" placeholder="6-digit area code">
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="nextStep(1)">Back</button>
            <button class="btn btn-primary" onclick="openReview()">Review & Register</button>
        </div>
    </div>
</div>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <h2 style="color: var(--text-heading);">Review Partnership Details</h2>
    <p style="font-size: 14px; margin-top: 5px;">Verify your details before final onboarding.</p>

    <div class="summary-box">
        <div class="summary-row"><span>Agent Name</span><strong id="rev-name"></strong></div>
        <div class="summary-row"><span>Mobile</span><strong id="rev-mobile"></strong></div>
        <div class="summary-row"><span>Jurisdiction</span><strong id="rev-area"></strong></div>
    </div>

    <label class="legal-check">
        <input type="checkbox" id="agree">
        <span>I agree to the <a href="terms.html" target="_blank">Agent Legal Agreement</a> and service guidelines.</span>
    </label>

    <div id="otp-box" style="display: none;">
        <label>Enter Security OTP</label>
        <input type="text" id="otp" placeholder="Enter 6-digit code" maxlength="6" style="text-align:center; letter-spacing: 5px; font-weight: bold;">
        <button class="btn btn-primary" style="margin-top: 20px; width: 100%;" onclick="finalSubmit()">Authorize & Finish</button>
    </div>

    <button class="btn btn-primary" id="requestOtpBtn" style="width: 100%;" onclick="requestOtp()">Confirm & Request OTP</button>
    <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="closeDrawer()">Edit Information</button>
</div>

<script src="config.js"></script>
<script>
    function nextStep(step) {
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
        
        const bar = document.getElementById('p-bar');
        const title = document.getElementById('title');
        const sub = document.getElementById('subtitle');

        if(step === 1) {
            bar.style.width = '50%';
            title.innerText = "Personal Info";
            sub.innerText = "Step 1: Tell us who you are.";
        } else {
            bar.style.width = '100%';
            title.innerText = "Service Area";
            sub.innerText = "Step 2: Define your operating zone.";
        }
    }

    function openReview() {
        const name = document.getElementById('name').value;
        const mobile = document.getElementById('mobile').value;
        const dist = document.getElementById('district').value;
        const pin = document.getElementById('pincode').value;

        if(!name || mobile.length < 10 || !dist || pin.length < 6) {
            alert("Please complete all fields correctly.");
            return;
        }

        document.getElementById('rev-name').innerText = name;
        document.getElementById('rev-mobile').innerText = "+91 " + mobile;
        document.getElementById('rev-area').innerText = `${dist} (${pin})`;

        document.getElementById('drawer').classList.add('active');
        document.getElementById('overlay').classList.add('active');
    }

    function closeDrawer() {
        document.getElementById('drawer').classList.remove('active');
        document.getElementById('overlay').classList.remove('active');
    }

    async function requestOtp() {
        // Validation for the checkbox before requesting OTP
        if(!document.getElementById("agree").checked){
            alert("You must accept the agreement before proceeding.");
            return;
        }

        const mobile = document.getElementById('mobile').value;
        const btn = document.getElementById('requestOtpBtn');
        btn.innerText = "Connecting...";
        
        try {
            const res = await fetch(`${API_BASE}/api/send-otp`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ mobile })
            });
            if(res.ok) {
                btn.style.display = 'none';
                document.getElementById('otp-box').style.display = 'block';
            }
        } catch(e) { alert("Server error"); btn.innerText = "Try Again"; }
    }

    async function finalSubmit() {
        // Double check agreement status on final submit
        if(!document.getElementById("agree").checked){
            alert("You must accept the agreement");
            return;
        }

        const payload = {
            name: document.getElementById('name').value,
            mobile: document.getElementById('mobile').value,
            district: document.getElementById('district').value,
            pincode: document.getElementById('pincode').value,
            otp: document.getElementById('otp').value
        };

        fetch(`${API_BASE}/api/agent/register`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(payload)
        }).then(res => {
            if(res.ok) {
                document.body.innerHTML = `<div style="text-align:center; padding:100px;">
                    <h1 style="color:var(--success)">Application Submitted!</h1>
                    <p>Your agent profile is being reviewed. Redirecting...</p>
                </div>`;
                setTimeout(() => window.location.href = "index.html", 3000);
            } else {
                alert("Verification failed. Please check OTP.");
            }
        });
    }
</script>

</body>
</html>
