<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - KaagazSeva</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(120deg,#eef3fb,#f7f9fc);
}

.container{
    background:white;
    padding:45px;
    border-radius:18px;
    width:380px;
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,0.08);
}

h2{
    color:#0a4fa3;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.customer{background:#0a4fa3;color:white;}
.agent{background:#ffcc00;}
.admin{background:#222;color:white;}

button:hover{opacity:0.9;}
</style>
</head>

<body>

<div class="container">
<h2>Select Login Type</h2>

<button class="customer" onclick="go('customer')">Customer Login</button>
<button class="agent" onclick="go('agent')">Agent Login</button>
<button class="admin" onclick="go('admin')">Admin Login</button>
</div>
<script src="config.js"></script>

<script>
function go(type){
    if(type==="customer"){
        window.location.href="customer-login.html";
    }
    if(type==="agent"){
        window.location.href="../agent/agent-login.html";
    }
    if(type==="admin"){
        window.location.href="../admin/dashboard.html";
    }
}
</script>

</body>
</html>
