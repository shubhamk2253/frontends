<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway - KaagazSeva</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0a4fa3;
            --accent: #ffcc00;
            --dark: #0f172a;
            --bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area i {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        h2 {
            color: var(--dark);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            background: white;
        }

        .login-card:hover {
            border-color: var(--primary);
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }

        .cust-icon { background: #eef4ff; color: var(--primary); }
        .agent-icon { background: #fffbeb; color: #b45309; }
        .founder-icon { background: #f1f5f9; color: var(--dark); }

        .card-text { text-align: left; }
        .card-text b { display: block; color: var(--dark); font-size: 16px; }
        .card-text span { font-size: 12px; color: #94a3b8; }

        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo-area">
            <i class="fas fa-shield-halved"></i>
            <h2>Secure Gateway</h2>
            <p>Select your identity to continue to the terminal</p>
        </div>

        <a href="customer/login.html" class="login-card">
            <div class="icon-box cust-icon"><i class="fas fa-user"></i></div>
            <div class="card-text">
                <b>Customer Portal</b>
                <span>Apply & Track Documents</span>
            </div>
        </a>

        <a href="agent/login.html" class="login-card">
            <div class="icon-box agent-icon"><i class="fas fa-user-tie"></i></div>
            <div class="card-text">
                <b>Agent Terminal</b>
                <span>Manage Client Requests</span>
            </div>
        </a>

        <a href="founder/login.html" class="login-card">
            <div class="icon-box founder-icon"><i class="fas fa-microchip"></i></div>
            <div class="card-text">
                <b>System Core</b>
                <span>Platform Governance</span>
            </div>
        </a>

        <div class="footer-note">
            AES-256 Encrypted Session
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        /**
         * Standardized Login Response Handler
         * Used inside your specific login pages (customer/login.html, etc.)
         */
        function finalizeLogin(data) {
            if(data.token) { // Changed 'access_token' to 'token' to match authFetch
                localStorage.clear();
                
                // Essential for authFetch logic
                localStorage.setItem("token", data.token); 
                localStorage.setItem("role", data.role);
                localStorage.setItem("name", data.name || "User");

                // Route based on role
                const routes = {
                    "customer": "/customer/dashboard.html",
                    "agent": "/agent/dashboard.html",
                    "founder": "/founder/control-tower.html",
                    "admin": "/admin/dashboard.html"
                };

                window.location.href = routes[data.role] || "/index.html";
            }
        }
    </script>
</body>
</html>
