<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access | KaagazSeva Central Command</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --founder-gold: #fbbf24;
            --state-emerald: #10b981;
            --district-sky: #38bdf8;
            --terminal-dark: #020617;
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--terminal-dark); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; color: white;
        }

        /* High-End Background: Neural Grid Effect */
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.3; }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            width: 100%; max-width: 480px;
            padding: 50px;
            border-radius: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 0 80px rgba(0,0,0,0.5);
            z-index: 10;
            text-align: center;
            position: relative;
        }

        /* Role Selector - The "No Developer" Design Touch */
        .role-selector {
            display: flex; background: rgba(0,0,0,0.4);
            padding: 6px; border-radius: 16px; margin-bottom: 35px;
            border: 1px solid var(--border);
        }

        .role-option {
            flex: 1; padding: 12px; font-size: 12px; font-weight: 700;
            cursor: pointer; border-radius: 12px; transition: 0.4s;
            text-transform: uppercase; letter-spacing: 1px; color: #64748b;
        }

        .role-option.active[data-role="district"] { background: var(--district-sky); color: var(--terminal-dark); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .role-option.active[data-role="state"] { background: var(--state-emerald); color: var(--terminal-dark); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .role-option.active[data-role="founder"] { background: var(--founder-gold); color: var(--terminal-dark); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }

        .admin-icon {
            width: 70px; height: 70px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 20px; border: 1px solid var(--border);
            transition: 0.5s;
        }

        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 5px; }
        .status-line { font-family: 'JetBrains Mono'; font-size: 11px; color: #94a3b8; margin-bottom: 30px; }

        .input-box { position: relative; margin-bottom: 20px; text-align: left; }
        label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 8px; display: block; }
        
        input {
            width: 100%; padding: 16px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border); border-radius: 14px;
            color: white; font-size: 15px; transition: 0.3s;
        }
        input:focus { border-color: var(--district-sky); outline: none; background: rgba(0,0,0,0.5); }

        .btn-access {
            width: 100%; padding: 18px; background: white; color: var(--terminal-dark);
            border: none; border-radius: 14px; font-weight: 800; cursor: pointer;
            transition: 0.3s; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-access:hover { transform: scale(1.02); filter: brightness(1.1); }

        .audit-footer { margin-top: 35px; font-family: 'JetBrains Mono'; font-size: 10px; color: #475569; border-top: 1px solid var(--border); padding-top: 20px; }
        
        #error-msg { color: #fb7185; font-size: 12px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="login-card">
    <div class="admin-icon" id="main-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    </div>

    <h1 id="header-text">Access Point</h1>
    <div class="status-line">TERMINAL STATUS: <span style="color:var(--state-emerald)">READY_FOR_HANDSHAKE</span></div>

    <div class="role-selector">
        <div class="role-option active" data-role="district" onclick="setRole('district')">District</div>
        <div class="role-option" data-role="state" onclick="setRole('state')">State</div>
        <div class="role-option" data-role="founder" onclick="setRole('founder')">Founder</div>
    </div>

    <div id="error-msg">INVALID_CREDENTIALS_ACCESS_DENIED</div>

    <form id="adminForm">
        <div class="input-box">
            <label id="user-label">District Auth ID</label>
            <input type="text" id="username" placeholder="SEC-ID-XXXX" required>
        </div>
        <div class="input-box">
            <label>Master Pass-Key</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-access" id="loginBtn">Initialize Connection</button>
    </form>

    <div class="audit-footer">
        SID: <span id="session-id">---</span> | NODE: <span id="ip-display">0.0.0.0</span><br>
        SYSTEM_AUTH_LEVEL: <span id="auth-level">LEVEL_1</span>
    </div>
</div>

<script>
    let currentRole = 'district';

    function setRole(role) {
        currentRole = role;
        // Update UI visuals
        document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('active'));
        document.querySelector(`[data-role="${role}"]`).classList.add('active');
        
        const btn = document.getElementById('loginBtn');
        const userLabel = document.getElementById('user-label');
        const icon = document.getElementById('main-icon');

        if(role === 'district') {
            userLabel.innerText = "District Auth ID";
            btn.innerText = "Initialize Node Connection";
            icon.style.color = 'var(--district-sky)';
            document.getElementById('auth-level').innerText = "LEVEL_1";
        } else if(role === 'state') {
            userLabel.innerText = "State Admin Portal ID";
            btn.innerText = "Establish State Authority";
            icon.style.color = 'var(--state-emerald)';
            document.getElementById('auth-level').innerText = "LEVEL_2";
        } else {
            userLabel.innerText = "Founder Root Key";
            btn.innerText = "Bypass to Master Root";
            icon.style.color = 'var(--founder-gold)';
            document.getElementById('auth-level').innerText = "LEVEL_ROOT";
        }
    }

    // High-Security: Generate Session ID on fly
    document.getElementById('session-id').innerText = Math.random().toString(36).substring(2, 10).toUpperCase();

    // IP Audit
    fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => document.getElementById('ip-display').innerText = data.ip);

    // Canvas Matrix Background Effect
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "010101SECURITYSYSTEMKAAGAZSEVA";
    const drops = Array(Math.floor(canvas.width/20)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(2, 6, 23, 0.05)";
        ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "#0f172a";
        ctx.font = "15px Courier New";
        drops.forEach((y, i) => {
            const text = chars[Math.floor(Math.random()*chars.length)];
            ctx.fillText(text, i*20, y*20);
            if(y*20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(drawMatrix, 50);

    // Submission Logic
    document.getElementById('adminForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('error-msg');
        
        btn.innerText = "SYNCHRONIZING...";
        btn.disabled = true;

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role: currentRole // Sending the role to backend
        };

        try {
            // Updated to use the Role-Based Backend endpoint
            const res = await fetch(`http://localhost:5000/api/admin/login`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if(res.ok) {
                localStorage.setItem("admin_token", data.access_token);
                localStorage.setItem("admin_role", currentRole);
                btn.innerText = "AUTH_SUCCESS";
                setTimeout(() => window.location.href = "admin-dashboard.html", 800);
            } else {
                err.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "RETRY_CONNECTION";
            }
        } catch(e) {
            btn.disabled = false;
            btn.innerText = "CONNECTION_LOST";
        }
    });
</script>

</body>
</html>
