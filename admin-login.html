<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication | KaagazSeva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Professional Color Palette */
            --primary: #1e293b;
            --district-color: #0284c7;
            --state-color: #059669;
            --founder-color: #7c3aed;
            --bg-gradient: radial-gradient(at 0% 0%, hsla(210, 40%, 96%, 1) 0, transparent 50%), 
                           radial-gradient(at 100% 100%, hsla(220, 30%, 92%, 1) 0, transparent 50%);
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(226, 232, 240, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #f8fafc;
            background-image: var(--bg-gradient);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            color: var(--primary);
        }

        /* Professional Card Design */
        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 48px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        /* The Role Bar - Segmented Control Style */
        .role-selector {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .role-tab {
            flex: 1;
            padding: 10px 5px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s all;
            color: #64748b;
        }

        .role-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Dynamic Indicator Line */
        .status-accent {
            height: 4px; width: 40px;
            border-radius: 2px;
            background: var(--district-color);
            margin: 0 auto 24px;
            transition: 0.3s;
        }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; color: #0f172a; }
        p.subtitle { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 32px; }

        /* Form Inputs */
        .input-group { margin-bottom: 20px; }
        label { 
            display: block; font-size: 12px; font-weight: 600; 
            color: #475569; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input {
            width: 100%; padding: 12px 16px;
            background: white; border: 1px solid #cbd5e1;
            border-radius: 10px; font-size: 15px; outline: none;
            transition: 0.2s;
        }

        input:focus { border-color: #94a3b8; box-shadow: 0 0 0 4px rgba(226, 232, 240, 0.5); }

        /* Modern Professional Button */
        .btn-login {
            width: 100%; padding: 14px; 
            background: #0f172a; color: white;
            border: none; border-radius: 10px; font-weight: 600;
            font-size: 15px; cursor: pointer; transition: 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover { background: #1e293b; transform: translateY(-1px); }

        .footer-info {
            margin-top: 32px; border-top: 1px solid #e2e8f0;
            padding-top: 24px; font-size: 11px; color: #94a3b8;
            display: flex; justify-content: space-between;
        }

        #error-msg {
            background: #fef2f2; color: #991b1b;
            padding: 12px; border-radius: 8px; font-size: 13px;
            margin-bottom: 20px; text-align: center; display: none;
            border: 1px solid #fee2e2;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="status-accent" id="accent-bar"></div>
    <h1>KaagazSeva</h1>
    <p class="subtitle">Administrative Access Terminal</p>

    <div class="role-selector">
        <div class="role-tab active" onclick="setRole('district', this)">District</div>
        <div class="role-tab" onclick="setRole('state', this)">State</div>
        <div class="role-tab" onclick="setRole('founder', this)">Founder</div>
    </div>

    <div id="error-msg">Authentication failed. Please verify credentials.</div>

    <form id="loginForm">
        <div class="input-group">
            <label id="user-label">District Credentials</label>
            <input type="text" id="username" placeholder="Enter Identity ID" required>
        </div>
        <div class="input-group">
            <label>Security Key</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
    </form>

    <div class="footer-info">
        <span>Terminal ID: <strong id="term-id">...</strong></span>
        <span>Secure Session</span>
    </div>
</div>

<script>
    let currentRole = 'district';
    const accents = { district: '#0284c7', state: '#059669', founder: '#7c3aed' };

    function setRole(role, el) {
        currentRole = role;
        // Update Tabs
        document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        
        // Update Accent Colors
        document.getElementById('accent-bar').style.background = accents[role];
        
        // Update Labels
        const label = document.getElementById('user-label');
        if(role === 'district') label.innerText = "District Credentials";
        else if(role === 'state') label.innerText = "State Authority ID";
        else label.innerText = "Founder Root ID";
    }

    // Generate a Professional Terminal ID
    document.getElementById('term-id').innerText = 'KS-' + Math.floor(1000 + Math.random() * 9000);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const err = document.getElementById('error-msg');
        
        btn.innerText = "Verifying...";
        btn.disabled = true;
        err.style.display = 'none';

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role: currentRole
        };

        try {
            const res = await fetch(`http://localhost:5000/api/admin/login`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                const data = await res.json();
                localStorage.setItem("admin_token", data.access_token);
                localStorage.setItem("admin_role", currentRole);
                btn.innerText = "Redirecting...";
                window.location.href = "admin-dashboard.html";
            } else {
                err.style.display = 'block';
                btn.innerText = "Sign In";
                btn.disabled = false;
            }
        } catch(e) {
            btn.innerText = "System Offline";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
