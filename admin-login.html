<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | KaagazSeva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0a4fa3; /* Professional Navy */
            --text-dark: #1a1a1a;
            --text-light: #666666;
            --bg-soft: #fcfcfc;
            --border: #e1e1e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-soft);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }

        .header {
            margin-bottom: 35px;
            text-align: left;
        }

        /* Focus on the Name: Bold, Clean, Professional */
        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #ffffff;
            transition: all 0.2s ease;
            color: var(--text-dark);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10, 79, 163, 0.05);
        }

        input::placeholder {
            color: #ccc;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #083d7e;
        }

        .footer-link {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-name">KaagazSeva</div>
        <p>Complete your partner registration</p>
    </div>

    <form id="regForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" placeholder="10-digit number" maxlength="10" required>
        </div>

        <div class="form-group">
            <label for="district">District</label>
            <input type="text" id="district" placeholder="Enter your city/district" required>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="footer-link">
        Already have an account? <a href="#">Login here</a>
    </div>
</div>

<script src="config.js"></script>
<script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Simple loading state
        const btn = e.target.querySelector('button');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const payload = {
            name: document.getElementById('name').value,
            mobile: document.getElementById('mobile').value,
            district: document.getElementById('district').value
        };

        try {
            const res = await fetch(`${API_BASE}/api/agent/register`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("Registration Successful");
                window.location.href = "login.html";
            } else {
                alert("Registration failed. Please try again.");
                btn.innerText = "Create Account";
                btn.disabled = false;
            }
        } catch (err) {
            console.error(err);
            btn.innerText = "Create Account";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
