<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Access | KaagazSeva Central</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --district: #0ea5e9;
            --state: #10b981;
            --founder: #f59e0b;
            --bg: #030712;
            --panel: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --glow: rgba(14, 165, 233, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; cursor: crosshair; }
        
        body { 
            background-color: var(--bg); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden; color: white;
            perspective: 1000px;
        }

        /* Animated Mesh Background */
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 1; filter: blur(100px); opacity: 0.4; pointer-events: none; }

        /* The Floating Card with 3D Tilt Effect */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 2px;
            border-radius: 38px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
            transition: transform 0.1s ease-out;
        }

        .login-card {
            background: var(--panel);
            backdrop-filter: blur(40px) saturate(180%);
            padding: 50px 45px;
            border-radius: 36px;
            text-align: center;
            border: 1px solid var(--border);
        }

        /* Dynamic Glow Orb */
        .glow-orb {
            position: absolute; width: 150px; height: 150px;
            background: var(--district);
            filter: blur(70px);
            top: -20px; right: -20px;
            border-radius: 50%;
            z-index: -1;
            transition: background 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Role Hexagons */
        .role-nav {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; margin-bottom: 35px;
        }

        .role-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            padding: 14px 5px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            transition: 0.4s all cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .role-btn.active { color: white; border-color: transparent; }
        .role-btn.active[data-role="district"] { background: var(--district); box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.5); }
        .role-btn.active[data-role="state"] { background: var(--state); box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.5); }
        .role-btn.active[data-role="founder"] { background: var(--founder); box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.5); }

        /* Input Styling */
        .field-group { margin-bottom: 22px; text-align: left; }
        .field-group label { 
            font-size: 10px; font-weight: 700; color: #94a3b8; 
            text-transform: uppercase; letter-spacing: 2px;
            margin-left: 5px; margin-bottom: 8px; display: block;
        }
        
        .input-wrapper {
            position: relative;
            background: rgba(0,0,0,0.5);
            border-radius: 18px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .input-wrapper:focus-within { border-color: var(--district); box-shadow: 0 0 0 4px var(--glow); }

        input {
            width: 100%; padding: 18px; background: transparent;
            border: none; color: white; font-size: 15px; outline: none;
            font-family: 'JetBrains Mono', monospace;
        }

        /* The Button */
        .btn-submit {
            width: 100%; padding: 20px; background: white; color: black;
            border: none; border-radius: 20px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; font-size: 13px;
            margin-top: 15px; transition: 0.4s;
            box-shadow: 0 20px 40px -10px rgba(255,255,255,0.2);
        }

        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 25px 50px -12px rgba(255,255,255,0.3); }
        .btn-submit:active { transform: scale(0.98); }

        .terminal-info {
            margin-top: 35px; border-top: 1px solid var(--border);
            padding-top: 25px; font-family: 'JetBrains Mono';
            font-size: 9px; color: #4b5563; text-align: left;
            display: flex; justify-content: space-between;
        }

        #error-msg {
            color: #ef4444; font-family: 'JetBrains Mono'; font-size: 11px;
            margin-bottom: 20px; display: none; padding: 10px;
            background: rgba(239, 68, 68, 0.1); border-radius: 10px;
        }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="login-container" id="tilt-card">
    <div class="glow-orb" id="dynamic-glow"></div>
    <div class="login-card">
        <div style="margin-bottom: 30px;">
            <h1 style="font-weight: 800; font-size: 32px; letter-spacing: -1px;">Kaagaz<span style="color:var(--district)" id="accent-text">Seva</span></h1>
            <p style="font-size: 12px; color: #64748b; margin-top: 5px; font-family: 'JetBrains Mono';">SECURE_ADMIN_GATEWAY_V4.0</p>
        </div>

        <div class="role-nav">
            <div class="role-btn active" data-role="district" onclick="switchRole('district')">District</div>
            <div class="role-btn" data-role="state" onclick="switchRole('state')">State</div>
            <div class="role-btn" data-role="founder" onclick="switchRole('founder')">Founder</div>
        </div>

        <div id="error-msg">[[ AUTH_FAILURE: INVALID_ENCRYPTION_KEY ]]</div>

        <form id="adminForm">
            <div class="field-group">
                <label id="role-label">District ID</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="UUID-XXXX-XXXX" required>
                </div>
            </div>
            <div class="field-group">
                <label>Access Token</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="mainBtn">Initiate Handshake</button>
        </form>

        <div class="terminal-info">
            <div>NODE_IP: <span id="ip" style="color:#94a3b8">...</span></div>
            <div>LEVEL: <span id="lvl-tag" style="color:var(--district)">NODE_1</span></div>
        </div>
    </div>
</div>

<script>
    let currentRole = 'district';
    const colors = { district: '#0ea5e9', state: '#10b981', founder: '#f59e0b' };

    function switchRole(role) {
        currentRole = role;
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-role="${role}"]`).classList.add('active');
        
        const glow = document.getElementById('dynamic-glow');
        const accent = document.getElementById('accent-text');
        const label = document.getElementById('role-label');
        const lvl = document.getElementById('lvl-tag');
        const btn = document.getElementById('mainBtn');

        glow.style.background = colors[role];
        accent.style.color = colors[role];
        lvl.style.color = colors[role];
        
        if(role === 'district') {
            label.innerText = "District ID";
            lvl.innerText = "NODE_1";
            btn.innerText = "Initiate Handshake";
        } else if(role === 'state') {
            label.innerText = "Regional Authority ID";
            lvl.innerText = "NODE_2";
            btn.innerText = "Verify State Authority";
        } else {
            label.innerText = "Root Founder Key";
            lvl.innerText = "ROOT_ACCESS";
            btn.innerText = "Bypass System Core";
        }
    }

    // 3D Tilt Effect
    const card = document.getElementById('tilt-card');
    document.addEventListener('mousemove', (e) => {
        let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // Background Animation
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 5 + 1;
            this.speedX = Math.random() * 3 - 1.5;
            this.speedY = Math.random() * 3 - 1.5;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.size > 0.2) this.size -= 0.1;
        }
        draw() {
            ctx.fillStyle = colors[currentRole];
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function handleParticles() {
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].size <= 0.3) {
                particles.splice(i, 1);
                i--;
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (particles.length < 100) particles.push(new Particle());
        handleParticles();
        requestAnimationFrame(animate);
    }
    animate();

    // IP Fetching
    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => document.getElementById('ip').innerText = d.ip);

    // Form Handle
    document.getElementById('adminForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('mainBtn');
        btn.innerText = "ENCRYPTING DATA...";
        btn.disabled = true;

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role: currentRole
        };

        try {
            const res = await fetch(`http://localhost:5000/api/admin/login`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                const data = await res.json();
                localStorage.setItem("admin_token", data.access_token);
                localStorage.setItem("admin_role", currentRole);
                btn.innerText = "ACCESS_GRANTED";
                setTimeout(() => window.location.href = "admin-dashboard.html", 1000);
            } else {
                document.getElementById('error-msg').style.display = 'block';
                btn.innerText = "RETRY_HANDSHAKE";
                btn.disabled = false;
            }
        } catch(e) {
            btn.innerText = "SYSTEM_OFFLINE";
        }
    });
</script>

</body>
</html>
