<!DOCTYPE html>
<html>
<head>
<title>Revenue Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Segoe UI;background:#f5f7fb;padding:40px;}
.container{max-width:1100px;margin:auto;background:white;padding:30px;border-radius:18px;}
h2{color:#0a4fa3;margin-bottom:20px;}
</style>
</head>

<body>
<div class="container">
<h2>Revenue Dashboard</h2>

<p>Today Revenue: ₹<span id="today"></span></p>
<p>Monthly Revenue: ₹<span id="monthly"></span></p>

<canvas id="serviceChart"></canvas>
<br><br>
<canvas id="districtChart"></canvas>
</div>

<script src="config.js"></script>
<script>

function authFetch(url, options = {}) {
    const token = localStorage.getItem("token");

    options.headers = {
        ...(options.headers || {}),
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
    };

    return fetch(API_BASE + url, options)
        .then(res => res.json());
}

fetch(`${API_BASE}/api/admin/revenue-stats`)
.then(res=>res.json())
.then(d=>{

document.getElementById("today").innerText = d.data.today;
document.getElementById("monthly").innerText = d.data.monthly;

/* Service chart */
const services = d.data.service.map(x=>x.service);
const sRevenue = d.data.service.map(x=>x.revenue);

new Chart(document.getElementById("serviceChart"),{
type:"bar",
data:{labels:services,datasets:[{label:"Revenue by Service",data:sRevenue}]}
});

/* District chart */
const districts = d.data.district.map(x=>x.district);
const dRevenue = d.data.district.map(x=>x.revenue);

new Chart(document.getElementById("districtChart"),{
type:"pie",
data:{labels:districts,datasets:[{data:dRevenue}]}
});

});

</script>
</body>
</html>
