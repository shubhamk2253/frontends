<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | My Applications</title>
    <style>
        :root {
            --primary: #0a4fa3;
            --secondary: #6c757d;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --bg: #f8f9fa;
            --text: #333;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
        }

        /* Sidebar simple style */
        .sidebar {
            width: 240px;
            background: #fff;
            height: 100vh;
            border-right: 1px solid #ddd;
            padding: 20px;
            position: fixed;
        }

        .main-content {
            margin-left: 280px;
            padding: 40px;
            width: 100%;
            max-width: 1000px;
        }

        h2 { color: var(--primary); margin-bottom: 30px; }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #eaeaea;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .info-group { flex-grow: 1; }
        
        .service-title { font-size: 1.2rem; color: var(--primary); margin-bottom: 5px; display: block; }
        
        .meta-info { font-size: 0.9rem; color: #666; margin-right: 15px; }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Status Colors */
        .status-pending { background: #fff3cd; color: #856404; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        /* Simple Loader */
        #loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body>

<div class="sidebar">
    <h3>User Panel</h3>
    <hr>
    <p><strong>Dashboard</strong></p>
    <p style="cursor:pointer" onclick="localStorage.clear(); location.href='../login.html'">Logout</p>
</div>

<div class="main-content">
    <h2>My Applications</h2>
    <div id="loader"></div>
    <div id="applications"></div>
</div>

<script src="../config.js"></script>
<script>
    // Security Check
    if(!localStorage.getItem("token")){
        window.location.href="../login.html";
    }

    async function loadApps(){
        const container = document.getElementById("applications");
        const loader = document.getElementById("loader");

        try {
            const res = await fetch(API_BASE + "/api/customer/applications", {
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });

            if(!res.ok) throw new Error("Failed to fetch");

            const data = await res.json();
            loader.style.display = "none";
            container.innerHTML = "";

            if (data.length === 0) {
                container.innerHTML = `<div class="empty-state">No applications found. Start by applying for a service!</div>`;
                return;
            }

            data.forEach(app => {
                // Determine CSS class for status
                const statusClass = app.status.toLowerCase().includes('pending') ? 'status-pending' : 
                                    app.status.toLowerCase().includes('completed') ? 'status-completed' : 'status-rejected';

                container.innerHTML += `
                <div class="card">
                    <div class="info-group">
                        <span class="service-title">${app.service_name}</span>
                        <span class="meta-info"><strong>ID:</strong> #${app.id.substring(0,8)}</span>
                        <span class="meta-info"><strong>Mode:</strong> ${app.mode}</span><br>
                        <span class="meta-info"><strong>Payment:</strong> ${app.payment_status || "Unpaid"}</span>
                    </div>
                    <div style="text-align:right">
                        <span class="badge ${statusClass}">${app.status}</span><br>
                        <button onclick="raiseTicket('${app.id}')">Need Help?</button>
                    </div>
                </div>
                `;
            });
        } catch (err) {
            loader.style.display = "none";
            container.innerHTML = `<p style="color:red">Error loading applications. Please login again.</p>`;
        }
    }

    function raiseTicket(id){
        window.location.href="raise-ticket.html?app=" + id;
    }

    loadApps();
</script>

</body>
</html>
