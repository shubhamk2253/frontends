<!DOCTYPE html>
<html>
<head>
<title>KaagazSeva — Agents Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(120deg,#eef3fb,#f7f9fc);
    padding:40px;
}

/* Header */
.header{
    max-width:1200px;
    margin:auto;
    margin-bottom:25px;
}

.header h1{
    color:#0a4fa3;
    font-size:28px;
}

.header p{
    color:#666;
}

/* Container */
.container{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

/* Cards */
.card{
    background:white;
    padding:28px;
    border-radius:18px;
    box-shadow:0 18px 45px rgba(0,0,0,0.08);
    transition:0.25s;
}

.card:hover{
    transform:translateY(-2px);
}

/* Titles */
.card h2{
    color:#0a4fa3;
    margin-bottom:15px;
}

/* Tables */
table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0a4fa3;
    color:white;
    padding:12px;
    font-size:14px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f5f8ff;
}

/* Buttons */
.btn{
    padding:8px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
}

.approve{
    background:linear-gradient(90deg,#00a86b,#00c37d);
    color:white;
}

.disable{
    background:linear-gradient(90deg,#ff5b5b,#ff3b3b);
    color:white;
}

</style>
</head>

<body>

<div class="header">
<h1>Agents Management Panel</h1>
<p>Approve, monitor, and control agent network across India</p>
</div>

<div class="container">

<div class="card">
<h2>Pending Agents</h2>
<table id="pendingTable">
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>District</th>
<th>Pincode</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="card">
<h2>Active Agents</h2>
<table id="activeTable">
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>District</th>
<th>Pincode</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>
<script src="config.js"></script>
<script>

function loadAgents(){

fetch(`${API_BASE}/api/admin/pending-agents`)
.then(res=>res.json())
.then(d=>{
    const tbody=document.querySelector("#pendingTable tbody");
    tbody.innerHTML="";
    d.data.forEach(a=>{
        tbody.innerHTML+=`
        <tr>
            <td>${a.name}</td>
            <td>${a.mobile}</td>
            <td>${a.district}</td>
            <td>${a.pincode}</td>
            <td><button class="btn approve" onclick="approve(${a.id})">Approve</button></td>
        </tr>`;
    });
});

fetch(`${API_BASE}/api/admin/active-agents`)
.then(res=>res.json())
.then(d=>{
    const tbody=document.querySelector("#activeTable tbody");
    tbody.innerHTML="";
    d.data.forEach(a=>{
        tbody.innerHTML+=`
        <tr>
            <td>${a.name}</td>
            <td>${a.mobile}</td>
            <td>${a.district}</td>
            <td>${a.pincode}</td>
            <td><button class="btn disable" onclick="disableAgent(${a.id})">Disable</button></td>
        </tr>`;
    });
});

}

function approve(id){
fetch(`${API_BASE}/api/admin/approve-agent`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({agent_id:id})
}).then(()=>loadAgents());
}

function disableAgent(id){
fetch(`${API_BASE}/api/admin/disable-agent`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({agent_id:id})
}).then(()=>loadAgents());
}

loadAgents();

</script>

</body>
</html>
