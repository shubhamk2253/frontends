<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KaagazSeva — System Core Management</title>
    <style>
        :root {
            --primary: #0a4fa3;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background: var(--bg); padding: 40px; color: #1e293b; }

        .header { max-width: 1200px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: var(--primary); font-size: 24px; font-weight: 800; }
        .badge-founder { background: #7c3aed; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        .container { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr; gap: 30px; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        
        h2 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #f1f5f9; color: #64748b; font-size: 13px; text-transform: uppercase; }
        td { padding: 16px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-approve { background: var(--success); color: white; }
        .btn-approve:hover { background: #059669; }
        .btn-disable { background: #fee2e2; color: var(--danger); }
        .btn-disable:hover { background: var(--danger); color: white; }

        .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>System Network Control</h1>
        <p>KaagazSeva Founder Authority Terminal</p>
    </div>
    <span class="badge-founder">ROOT_ACCESS_GRANTED</span>
</div>

<div class="container">
    <div class="card">
        <h2>🕒 Pending Partnerships</h2>
        <table id="pendingTable">
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Contact</th>
                    <th>Region (District)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="pending-list"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>✅ Verified Agent Network</h2>
        <table id="activeTable">
            <thead>
                <tr>
                    <th>Agent Name</th>
                    <th>Mobile</th>
                    <th>Jurisdiction</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="active-list"></tbody>
        </table>
    </div>
</div>

<script src="config.js"></script>
<script>
    // SECURITY CHECK: Redirect if no token
    const token = localStorage.getItem("token");
    if(!token) window.location.href = "login.html";

    const headers = {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
    };

    async function loadDashboard() {
        try {
            // Load Pending
            const resPending = await fetch(`${API_BASE}/api/admin/pending-agents`, { headers });
            const pendingData = await resPending.json();
            renderTable("pending-list", pendingData, true);

            // Load Active
            const resActive = await fetch(`${API_BASE}/api/admin/active-agents`, { headers });
            const activeData = await resActive.json();
            renderTable("active-list", activeData, false);
        } catch (err) {
            console.error("Session Expired or Connection Error");
        }
    }

    function renderTable(elementId, data, isPending) {
        const container = document.getElementById(elementId);
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = `<tr><td colspan="5" class="empty-state">No records found</td></tr>`;
            return;
        }

        data.forEach(item => {
            const row = `
                <tr>
                    <td><strong>${item.full_name || item.name}</strong></td>
                    <td>${item.mobile}</td>
                    <td>${item.district_id || item.district}</td>
                    ${!isPending ? '<td><span style="color:green">● Active</span></td>' : ''}
                    <td>
                        ${isPending 
                            ? `<button class="btn btn-approve" onclick="actionAgent('approve', '${item.id}')">Approve Access</button>`
                            : `<button class="btn btn-disable" onclick="actionAgent('disable', '${item.id}')">Revoke Access</button>`
                        }
                    </td>
                </tr>
            `;
            container.innerHTML += row;
        });
    }

    async function actionAgent(type, id) {
        const endpoint = type === 'approve' ? `/api/admin/approve-agent/${id}` : `/api/admin/disable-agent/${id}`;
        
        const confirmMsg = type === 'approve' 
            ? "Confirm this agent for the KaagazSeva Partner Network?" 
            : "Warning: This will immediately revoke all dashboard access for this agent. Proceed?";

        if(!confirm(confirmMsg)) return;

        try {
            const res = await fetch(`${API_BASE}${endpoint}`, { 
                method: "POST", 
                headers 
            });
            const result = await res.json();
            
            if(res.ok) {
                alert(result.message);
                loadDashboard();
            } else {
                alert(result.error || "Action failed");
            }
        } catch (err) {
            alert("Critical Server Error");
        }
    }

    // Initial Load
    loadDashboard();
</script>
</body>
</html>
