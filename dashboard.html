<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Analytics Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0a4fa3;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f4f7fb;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 30px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-5px); }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 20px;
        }

        .revenue-icon { background: #e8f5e9; color: var(--success); }
        .refund-icon { background: #ffebee; color: var(--danger); }
        .agent-icon { background: #e3f2fd; color: var(--primary); }
        .pending-icon { background: #fff3e0; color: var(--warning); }

        .stat-info h3 { margin: 0; font-size: 14px; color: #7f8c8d; text-transform: uppercase; }
        .stat-info p { margin: 5px 0 0; font-size: 24px; font-weight: bold; color: #2c3e50; }

        /* Chart Section */
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
        }

        .loader { text-align: center; padding: 50px; font-style: italic; color: #95a5a6; }
    </style>
</head>
<body>

<div class="header">
    <h2><i class="fa fa-chart-line"></i> Platform Analytics</h2>
    <button onclick="loadStats()" style="padding: 10px 20px; cursor: pointer; border-radius: 8px; border: none; background: var(--primary); color: white;">
        <i class="fa fa-sync"></i> Refresh
    </button>
</div>

<div id="loader" class="loader">Fetching latest data...</div>

<div id="dashboard-content" style="display: none;">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon revenue-icon"><i class="fa fa-indian-rupee-sign"></i></div>
            <div class="stat-info">
                <h3>Total Revenue</h3>
                <p id="total_revenue">₹0</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon refund-icon"><i class="fa fa-undo"></i></div>
            <div class="stat-info">
                <h3>Total Refunds</h3>
                <p id="total_refunds">₹0</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon agent-icon"><i class="fa fa-user-check"></i></div>
            <div class="stat-info">
                <h3>Active Agents</h3>
                <p id="active_agents">0</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon pending-icon"><i class="fa fa-user-clock"></i></div>
            <div class="stat-info">
                <h3>Pending Approval</h3>
                <p id="pending_agents">0</p>
            </div>
        </div>
    </div>

    <div class="chart-container">
        <h3>Revenue vs Refunds Distribution</h3>
        <canvas id="analyticsChart"></canvas>
    </div>
</div>

<script src="../config.js"></script>
<script>
let myChart = null;

async function loadStats(){
    try {
        const res = await fetch(API_BASE + "/api/admin/analytics", {
            headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
        });

        if (!res.ok) throw new Error("Auth failed");

        const data = await res.json();

        // Update Text
        document.getElementById("total_revenue").innerText = `₹${data.total_revenue.toLocaleString()}`;
        document.getElementById("total_refunds").innerText = `₹${data.total_refunds.toLocaleString()}`;
        document.getElementById("active_agents").innerText = data.active_agents;
        document.getElementById("pending_agents").innerText = data.pending_agents;

        // UI Transitions
        document.getElementById("loader").style.display = "none";
        document.getElementById("dashboard-content").style.display = "block";

        updateChart(data.total_revenue, data.total_refunds);

    } catch (err) {
        console.error(err);
        document.getElementById("loader").innerHTML = `<span style="color:red">Error loading dashboard. Please login again.</span>`;
    }
}

function updateChart(rev, ref) {
    const ctx = document.getElementById('analyticsChart').getContext('2d');
    
    if (myChart) myChart.destroy();

    myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Net Revenue', 'Refunds'],
            datasets: [{
                data: [rev - ref, ref],
                backgroundColor: ['#27ae60', '#e74c3c'],
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom' } }
        }
    });
}

loadStats();
</script>

</body>
</html>
