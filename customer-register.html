<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Enrollment | KaagazSeva India</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    
    <style>
        :root {
            --primary: #0a4fa3;
            --primary-dark: #063166;
            --bg-canvas: #f8fafc;
            --glass: rgba(255, 255, 255, 0.95);
            --border: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #475569;
            --success: #10b981;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-canvas); color: var(--text-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }

        .enrollment-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 48px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            z-index: 10;
        }

        .brand { color: var(--primary); font-weight: 800; font-size: 20px; margin-bottom: 24px; text-align: center; }
        h1 { color: var(--text-heading); font-size: 32px; font-weight: 700; text-align: center; margin-bottom: 8px; letter-spacing: -1px; }
        .subtitle { text-align: center; margin-bottom: 40px; font-size: 15px; }

        .form-group { margin-bottom: 24px; }
        label { display: block; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; color: var(--text-heading); }
        
        input, select {
            width: 100%;
            padding: 16px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 16px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(10, 79, 163, 0.1);
            transform: translateY(-1px);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 15px -3px rgba(10, 79, 163, 0.2);
        }

        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(10, 79, 163, 0.2); }

        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            visibility: hidden; opacity: 0; transition: 0.4s; z-index: 1000;
        }
        .drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: white; border-radius: 32px 32px 0 0;
            padding: 40px; transition: 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 1001; max-height: 80vh; overflow-y: auto;
        }
        .drawer.active { bottom: 0; }
        .drawer-overlay.active { visibility: visible; opacity: 1; }

        .review-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #f1f5f9; }
        .review-label { font-weight: 500; color: var(--text-body); }
        .review-value { font-weight: 700; color: var(--text-heading); }

        .hidden { display: none; }
        .error-toast { color: #e11d48; font-size: 13px; font-weight: 600; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="enrollment-card">
    <div class="brand">KaagazSeva</div>
    <h1>Create Account</h1>
    <p class="subtitle">Secure digital document processing starts here.</p>

    <form id="regForm">
        <div class="form-group">
            <label>Full Legal Name</label>
            <input type="text" id="name" placeholder="Enter as per Aadhaar/PAN" required>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="10-digit mobile" maxlength="10" required>
        </div>

        <div class="form-group">
            <label>Residential State</label>
            <select id="state" required>
                <option value="">Select your state</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="West Bengal">West Bengal</option>
                </select>
        </div>

        <button type="button" class="btn-primary" onclick="openReview()">Continue to Review</button>
    </form>
    
    <div id="errorBox" class="error-toast"></div>

    <p style="text-align: center; margin-top: 30px; font-size: 14px;">
        Already registered? <a href="customer-login.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign In</a>
    </p>
</div>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <h2 style="margin-bottom: 20px; color: var(--text-heading);">Confirm Details</h2>
    <p style="margin-bottom: 24px; font-size: 14px;">Please verify your information before we send the secure OTP.</p>
    
    <div class="review-item"><span class="review-label">Name</span> <span class="review-value" id="rev-name">-</span></div>
    <div class="review-item"><span class="review-label">Mobile</span> <span class="review-value" id="rev-mobile">-</span></div>
    <div class="review-item"><span class="review-label">State</span> <span class="review-value" id="rev-state">-</span></div>

    <div id="otp-area" class="hidden" style="margin-top: 20px;">
        <label>Enter 6-Digit OTP</label>
        <input type="text" id="otp" placeholder="......" maxlength="6" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
        <button class="btn-primary" style="margin-top: 20px;" id="finalBtn" onclick="verifyAndFinish()">Complete Registration</button>
    </div>

    <button class="btn-primary" style="margin-top: 30px;" id="sendOtpBtn" onclick="requestOTP()">Confirm & Send OTP</button>
    <button onclick="closeDrawer()" style="width: 100%; background: none; border: none; margin-top: 15px; color: var(--text-body); cursor: pointer;">Edit Information</button>
</div>

<script>
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');

    function openReview() {
        const name = document.getElementById('name').value;
        const mobile = document.getElementById('mobile').value;
        const state = document.getElementById('state').value;

        if(!name || mobile.length < 10 || !state) {
            document.getElementById('errorBox').innerText = "Please complete all fields correctly.";
            return;
        }

        document.getElementById('rev-name').innerText = name;
        document.getElementById('rev-mobile').innerText = "+91 " + mobile;
        document.getElementById('rev-state').innerText = state;

        drawer.classList.add('active');
        overlay.classList.add('active');
    }

    function closeDrawer() {
        drawer.classList.remove('active');
        overlay.classList.remove('active');
    }

    async function requestOTP() {
        const mobile = document.getElementById('mobile').value;
        const btn = document.getElementById('sendOtpBtn');
        
        btn.disabled = true;
        btn.innerText = "Securing Connection...";

        try {
            // Updated to authFetch
            const res = await authFetch("/api/send-otp", {
                method: 'POST',
                body: JSON.stringify({ mobile })
            });

            if(res.ok) {
                btn.classList.add('hidden');
                document.getElementById('otp-area').classList.remove('hidden');
            } else {
                alert("Error sending OTP. Please check your mobile number.");
                btn.disabled = false;
                btn.innerText = "Confirm & Send OTP";
            }
        } catch (e) {
            alert("Server unreachable.");
            btn.disabled = false;
        }
    }

    async function verifyAndFinish() {
        const mobile = document.getElementById('mobile').value;
        const otp = document.getElementById('otp').value;
        const finalBtn = document.getElementById('finalBtn');

        finalBtn.disabled = true;
        finalBtn.innerText = "Authenticating...";

        try {
            // Updated to authFetch
            const res = await authFetch("/api/verify-otp", {
                method: 'POST',
                body: JSON.stringify({ mobile, otp })
            });
            const data = await res.json();

            if(res.ok) {
                localStorage.setItem("token", data.access_token);
                document.body.innerHTML = `<div style="text-align:center; padding:50px;">
                    <h1 style="color:var(--success)">Account Verified!</h1>
                    <p>Welcome to KaagazSeva. Redirecting to your dashboard...</p>
                </div>`;
                setTimeout(() => window.location.href = "index.html", 2000);
            } else {
                alert(data.error || "Invalid OTP code.");
                finalBtn.disabled = false;
                finalBtn.innerText = "Complete Registration";
            }
        } catch (e) {
            finalBtn.disabled = false;
        }
    }
</script>

</body>
</html>
